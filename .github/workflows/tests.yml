name: Tests

# Runs the browser tests in tests/ for every pull request and every change to main, so a broken tab or
# chart shows up before (or right after) it reaches the site. Data updates don't start it.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # A failed test leaves a trace (open it at https://trace.playwright.dev) under the run's Artifacts.
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
