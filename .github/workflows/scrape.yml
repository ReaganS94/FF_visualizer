name: Einsätze aktualisieren

on:
  schedule:
    # Twice a day (UTC; 06:15 and 18:15 in German summer time). GitHub sometimes skips a
    # scheduled run under load, so the second run is also a safety net.
    - cron: "15 4 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch alarm list
        run: python scraper/scrape.py
      - name: Fetch weather
        run: python scraper/weather.py
        continue-on-error: true # weather is optional, don't lose new alarms over it
      - name: Fetch Hannover 96 home games
        run: python scraper/football.py
        continue-on-error: true # only the Mythen-Check uses them
      - name: Look up new streets for the map
        run: python scraper/geocode.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git add docs/data
          # Commit even if only the timestamp changed: the site shows it as "Stand" and uses it
          # to know which days are fully covered.
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daten aktualisiert $(date -u +%F)"
          # The admin page may have committed in the meantime, even between the pull and the push.
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
