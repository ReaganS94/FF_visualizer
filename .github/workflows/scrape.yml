name: Einsätze aktualisieren

on:
  schedule:
    - cron: "15 4 * * *" # daily, 06:15 Hannover summer time
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-data

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch alarm list
        run: python scraper/scrape.py
      - name: Fetch weather
        run: python scraper/weather.py
        continue-on-error: true # weather is optional, don't lose new alarms over it
      - name: Look up new streets for the map
        run: python scraper/geocode.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git add docs/data
          # Only commit when data changed, not just the timestamps.
          if git diff --cached --quiet -I '"updated"'; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daten aktualisiert $(date -u +%F)"
          # The admin page may have committed in the meantime.
          git pull --rebase
          git push
